<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Subtle Greenhouse frame outline -->
  <path d="M120 400 L120 250 L256 130 L392 250 L392 400 Z" fill="none" stroke="#10b981" stroke-width="12" stroke-linejoin="round" opacity="0.4"/>
  <path d="M256 130 L256 400" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="16 12" opacity="0.3"/>
  <path d="M120 280 L392 280" fill="none" stroke="#10b981" stroke-width="8" opacity="0.3"/>

  <!-- Ground Line -->
  <path d="M96 410 C180 400, 332 400, 416 410" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round"/>

  <!-- Plant Stem & Leaves -->
  <path d="M256 400 C256 310, 256 220, 256 195" fill="none" stroke="#34d399" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Left Leaf -->
  <path d="M256 320 C180 320, 150 250, 160 215 C195 210, 245 255, 256 280 Z" fill="url(#sproutGrad)"/>
  
  <!-- Right Leaf -->
  <path d="M256 270 C332 270, 362 200, 352 165 C317 160, 267 205, 256 230 Z" fill="url(#sproutGrad)"/>

  <!-- Central Water Droplet (Irrigation & Climate) -->
  <path d="M256 100 C256 100, 215 155, 215 185 C215 208, 233 226, 256 226 C279 226, 297 208, 297 185 C297 155, 256 100, 256 100 Z" fill="url(#waterGrad)"/>
  <circle cx="244" cy="180" r="8" fill="#ffffff" opacity="0.6"/>

  <!-- Brand Typography -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ecfdf5" text-anchor="middle" letter-spacing="4">BELENT AGRO</text>
</svg>
